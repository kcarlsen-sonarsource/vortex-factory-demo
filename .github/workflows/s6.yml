name: S6
# Temporary. Removed from main after the smoke run.
on:
  workflow_dispatch:
permissions: {}
jobs:
  s6:
    name: S6
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: factory-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mint the App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Push a branch and open a PR as the App
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          set -u
          mkdir -p out
          echo "app slug: $APP_SLUG" | tee out/app.txt
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git switch -c smoke/s6
          printf 'S6 smoke: harmless file added by the factory App.\n' > SMOKE-S6.md
          git add SMOKE-S6.md
          git commit -q -m "S6 smoke: add a harmless file"
          git rev-parse HEAD | tee out/pr-head-sha.txt
          git push origin smoke/s6 2>&1 | tee out/push-branch.txt
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head smoke/s6 --title "S6 smoke: harmless file" --body "Temporary smoke PR opened by the factory App. Closed unmerged." 2>&1 | tee out/pr-create.txt
          # A push that touches .github/workflows must be refused for an App without the workflows permission.
          git switch -c smoke/s6-workflow
          mkdir -p .github/workflows
          printf 'name: probe\non: workflow_dispatch\njobs:\n  probe:\n    runs-on: ubuntu-24.04\n    steps:\n      - run: echo probe\n' > .github/workflows/s6-probe.yml
          git add .github/workflows/s6-probe.yml
          git commit -q -m "S6 smoke: workflow file probe"
          set +e
          git push origin smoke/s6-workflow > out/push-workflow.txt 2>&1
          echo "exit code: $?" >> out/push-workflow.txt
          set -e
          cat out/push-workflow.txt
      - name: Redact and upload
        if: always()
        run: sed -i "s#x-access-token:[^@]*@#x-access-token:[REDACTED]@#g" out/* 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: s6-out
          path: out
          retention-days: 14
